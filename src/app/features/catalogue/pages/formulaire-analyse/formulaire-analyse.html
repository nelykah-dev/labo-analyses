<h2>{{ id() ? 'Modifier une analyse' : 'Nouvelle analyse' }}</h2>

<form (ngSubmit)="soumettre()">
  <label>
    Nom
    <input type="text" name="nom" [ngModel]="nom()" (ngModelChange)="nom.set($event)" required />
  </label>
  <label>
    Unité
    <input
      type="text"
      name="unite"
      [ngModel]="unite()"
      (ngModelChange)="unite.set($event)"
      required
    />
  </label>
  <label>
    Type d'échantillon
    <input
      type="text"
      name="typeEchantillon"
      [ngModel]="typeEchantillon()"
      (ngModelChange)="typeEchantillon.set($event)"
      required
    />
  </label>
  <label>
    Valeur plancher de référence
    <input
      type="number"
      name="refMin"
      [ngModel]="refMin()"
      (ngModelChange)="refMin.set($event === '' ? null : +$event)"
    />
  </label>
  <label>
    Valeur plafond de référence
    <input
      type="number"
      name="refMax"
      [ngModel]="refMax()"
      (ngModelChange)="refMax.set($event === '' ? null : +$event)"
    />
  </label>
  <label>
    Prix (€)
    <input
      type="number"
      name="prix"
      [ngModel]="prix()"
      (ngModelChange)="prix.set($event === '' ? null : +$event)"
    />
  </label>

  @for (erreur of erreurs(); track erreur) {
    <p role="alert" class="erreur">{{ erreur }}</p>
  }
  @if (messageSucces(); as message) {
    <p role="status" class="succes">{{ message }}</p>
  }

  <button type="submit" [disabled]="enCours()">Enregistrer</button>
  <a routerLink="/analyses">Annuler</a>
</form>
